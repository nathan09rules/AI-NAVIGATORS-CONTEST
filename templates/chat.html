<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with HealthBot</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            display: flex;
            height: 100vh;
            background-color: #f4f4f4;
        }
        .sidebar {
            width: 250px;
            background: #1a1a1a;
            color: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .sidebar h2 {
            margin-bottom: 20px;
        }
        .sidebar a {
            text-decoration: none;
            color: white;
            display: block;
            padding: 10px;
            width: 100%;
            text-align: center;
            border-radius: 5px;
            margin-bottom: 10px;
            transition: background 0.3s;
        }
        .sidebar a:hover {
            background: #444;
        }
        .content {
            flex: 1;
            padding: 20px;
            position: relative;
        }
        .main-content {
            margin-top: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Chatbot UI */
        .chat-container {
            width: 90%;
            max-width: 600px;
            background: white;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
        }
        .chat-box {
            height: 500px; /* Increased from 350px to 500px */
            overflow-y: auto;
            padding: 15px;
            border-bottom: 2px solid #ddd;
            display: flex;
            flex-direction: column;
            font-size: 18px; /* Bigger font size */
        }
        .chat-box::-webkit-scrollbar {
            width: 5px;
        }
        .chat-box::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 5px;
        }
        .message {
            max-width: 80%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 10px;
            opacity: 0;
            animation: fadeIn 0.3s forwards;
            font-size: 18px; /* Larger font */
        }
        .user-message {
            background: #007bff;
            color: white;
            align-self: flex-end;
        }
        .bot-message {
            background: #f1f1f1;
            color: black;
            align-self: flex-start;
        }
        .input-container {
            display: flex;
            margin-top: 10px;
        }
        #chat-input {
            flex: 1;
            padding: 14px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 18px; /* Bigger input field */
            outline: none;
        }
        #send-btn {
            padding: 14px 18px;
            margin-left: 10px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px; /* Bigger button */
            transition: background 0.3s;
        }
        #send-btn:hover {
            background: #218838;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Menu</h2>
        <a href="{{ url_for('index')}}">Home</a>
        <a href="{{ url_for('find_symptoms')}}">Find Symptoms</a>
        <a href="{{ url_for('template')}}">Template</a>
        <a href="{{ url_for('chatbot')}}">chat</a>
        <a href="{{ url_for('suma')}}">news</a>
    </div>

    <div class="content">
        <div class="header"></div>
        <div class="main-content">
            <h1>Chat with HealthBot</h1>

            <div class="chat-container">
                <div id="chat-box" class="chat-box"></div>
                <div class="input-container">
                    <input type="text" id="chat-input" placeholder="Ask about your symptoms..." autofocus>
                    <button id="send-btn">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById("chat-box");
        const inputField = document.getElementById("chat-input");
        const sendBtn = document.getElementById("send-btn");

        function appendMessage(content, type) {
            let messageDiv = document.createElement("div");
            messageDiv.classList.add("message", type === "user" ? "user-message" : "bot-message");
            messageDiv.innerText = content;
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function sendMessage() {
            let message = inputField.value.trim();
            if (message === "") return;

            appendMessage(message, "user");
            inputField.value = "";

            fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: message })
            })
            .then(response => response.json())
            .then(data => {
                appendMessage(data.response, "bot");
            })
            .catch(error => {
                console.error("Error:", error);
                appendMessage("Sorry, something went wrong.", "bot");
            });
        }

        sendBtn.addEventListener("click", sendMessage);
        inputField.addEventListener("keypress", function(event) {
            if (event.key === "Enter") sendMessage();
        });
    </script>
</body>
</html>
