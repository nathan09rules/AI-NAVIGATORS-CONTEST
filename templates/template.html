<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 1</title>
    <link rel="stylesheet" href="static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            display: flex;
            height: 100vh;
            background-color: #f4f4f4;
        }
        .sidebar {
            width: 250px;
            background: #1a1a1a;
            color: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .sidebar h2 {
            margin-bottom: 20px;
        }
        .sidebar a {
            text-decoration: none;
            color: white;
            display: block;
            padding: 10px;
            width: 100%;
            text-align: center;
            border-radius: 5px;
            margin-bottom: 10px;
            transition: background 0.3s;
        }
        .sidebar a:hover {
            background: #444;
        }
        .content {
            flex: 1;
            padding: 20px;
            position: relative;
        }
        .header {
            width: 100%;
            height: 70px;
            background: red;
            position: absolute;
            top: 0;
            left: 0;
        }
        .main-content {
            margin-top: 80px;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Menu</h2>
        <a href="{{ url_for('index')}}">Home</a>
        <a href="{{ url_for('find_symptoms')}}">Find Symptoms</a>
        <a href="{{ url_for('template')}}">Template</a>
        <a href="{{ url_for('chatbot')}}">chat</a>
    </div>

    <div class="content">

    </div>
            <script src="/static/script.js"></script>            
        </div>
    </div>
</body>
</html>
